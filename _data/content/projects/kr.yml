      post: |
        # 매도 전략 비교: MA 기반 매도 vs 고정 R 매도

        같은 종목 선정·매수 로직(모멘텀/RS 기반) 위에서 **매도 전략만** 바꿔
        성과가 어떻게 달라지는지 백테스트로 비교했습니다.

        ### 실험 조건

        | 항목 | 내용 |
        | ---- | ---- |
        | 기간 | 2017-10-31 ~ 2026-08-07 (약 8.8년) |
        | 유니버스 | KOSPI + KOSDAQ 전 종목 (거래대금·시가총액 필터 적용) |
        | 초기 자금 | 1억 원, 복리 미적용 |
        | 수수료 | 매수 0.015%, 매도 0.2% 반영 |
        | 매수 로직 | 두 전략 동일 (신고가 돌파 + RS 상위 + 회전율 상위) |
        {:data-align="center"}

        두 매도 전략의 규칙은 다음과 같습니다. (R = 7%)

        | | MA 기반 매도 | 고정 R 매도 |
        | ---- | ---- | ---- |
        | 익절 | 종가가 **MA20 × 1.5** (이격도 150) 도달 시 전량 매도 | **+3R (+21%)** 도달 시 전량 매도 |
        | 손절 | max(매수가 − 1R, **당일 MA20**) — MA를 따라 올라가는 트레일링 스탑 | **−1R (−7%)** 고정 손절 |
        {:data-align="center"}

        그 외 RS 이탈 매도, 시장 국면(지수 MA120) 필터 등은 두 전략에 동일하게
        적용됩니다.

        ***

        ### 요약

        **결론부터: 8.8년 전 구간에서 MA 기반 매도가 우세했습니다.**
        수익은 더 크고(+675% vs +582%), 낙폭은 더 얕고(−17.1% vs −18.7%),
        위험 대비 수익(샤프)도 더 좋습니다.

        | 지표 | MA 기반 매도 | 고정 R 매도 |
        | ---- | ----: | ----: |
        | 총수익률 | **+674.9%** | +582.4% |
        | 연평균 수익률 (CAGR) | **26.3%** | 24.5% |
        | 최대 낙폭 (MDD) | **−17.1%** | −18.7% |
        | 샤프 지수 | **2.07** | 1.88 |
        | 거래 횟수 | 617회 | 701회 |
        | 승률 | **45.4%** | 40.1% |
        | 평균 수익 (익절 시) | +17.5% | +19.2% |
        | 평균 손실 (손절 시) | −6.5% | −7.3% |
        | 최대 수익 거래 | **+98.1%** | +32.2% |
        | Profit Factor | **2.23** | 1.76 |
        | 평균 보유일 | 9.0일 | 7.9일 |
        {:data-align="center"}

        ***

        ### 누적 자산과 낙폭

        ![누적 자산 및 낙폭](:stockguide/equity_drawdown.png)

        - 2020년까지는 두 전략이 거의 같이 움직이다가, **2020~2021 강세장에서
          MA 기반 매도가 격차를 벌립니다.** 큰 추세가 나올 때 이격도 익절선이
          가격을 따라 멀어지면서 추세를 끝까지 태우기 때문입니다.
        - 낙폭 프로파일은 두 전략이 비슷하지만(최대 낙폭은 둘 다 2018년),
          고정 R이 대체로 조금 더 깊게 눌립니다.
        - 같은 기간 KOSPI(회색 점선)는 2.5배로, 두 전략 모두 시장을 크게
          앞섰습니다.

        ### 거래별 수익률 분포 — 두 전략의 성격 차이

        ![거래별 수익률 분포](:stockguide/trade_distribution.png)

        이 차트가 두 전략의 차이를 가장 잘 보여줍니다.

        - **고정 R 매도**는 분포가 **−7%와 +21% 두 지점에 뾰족하게** 몰려
          있습니다. 규칙이 그대로 결과에 찍히는, 예측 가능한 구조입니다.
          대신 +21%가 상한이라 **큰 추세 수익이 원천적으로 잘립니다**
          (최대 +32%는 갭 상승 덕분).
        - **MA 기반 매도**는 오른쪽 꼬리가 **+98%까지** 길게 뻗어 있습니다.
          손절 구간도 트레일링 스탑(당일 MA20) 덕분에 −7%보다 얕은 곳에
          퍼져 있습니다.
        - 두 전략 모두 **거래의 중앙값은 마이너스**입니다(MA −2.5%, R −7.2%).
          즉 절반 이상의 거래는 잃고, 소수의 큰 수익이 전체 성과를 만드는
          전형적인 추세추종 구조 — 그래서 오른쪽 꼬리를 얼마나 길게 가져가느냐가
          성과를 가릅니다.

        ### 연도별 수익률

        ![연도별 수익률](:stockguide/yearly_returns.png)

        - 추세가 강했던 해(2020, 2021, 2025)는 **MA 기반이 크게 앞섭니다.**
        - 반대로 횡보하거나 짧은 등락이 반복된 해(2018, 2024, 2026)는
          **고정 R이 오히려 낫습니다.** 2024년이 대표적입니다
          (MA −3.3% vs R +4.5%). 추세가 금방 꺾이는 장에서는 +21%에서
          기계적으로 챙기는 쪽이 유리하기 때문입니다.

        ### 최근 1년 롤링 수익률

        ![롤링 1년 수익률](:stockguide/rolling_12m.png)

        어느 시점에 진입했더라도 직전 1년 성과가 어땠는지를 보여줍니다.
        두 전략 모두 대부분 구간에서 플러스를 유지하며, 격차가 벌어지는
        구간(2020~2021)이 MA 기반 매도의 초과 수익 원천임을 확인할 수 있습니다.

        ### 월별 수익률 히트맵

        ![월별 수익률 히트맵](:stockguide/monthly_heatmap.png)

        월 단위로 보면 두 전략 모두 큰 손실 월이 드물고(−7% 이하 월이 각 1~2회),
        수익이 특정 월에 집중되는 패턴이 비슷합니다. 다만 같은 달에도 MA 기반의
        수익 월이 더 두껍게 나오는 경향이 있습니다.

        ***

        ### 해석과 결론

        1. **오른쪽 꼬리가 성과를 만든다.** 두 전략 모두 승률이 50% 미만이고
           거래 중앙값이 마이너스입니다. 성과 차이는 결국 "큰 수익 거래를
           얼마나 크게 가져가는가"에서 나왔고, 익절 상한이 없는 MA 기반이
           이 지점에서 이겼습니다 (Profit Factor 2.23 vs 1.76).
        2. **고정 R의 장점은 예측 가능성.** 손익 구조가 −1R/+3R로 고정되어
           기대값 계산과 자금 관리가 단순하고, 횡보장(2018, 2024)에서는
           오히려 더 나은 성과를 냈습니다.
        3. **트레일링 스탑이 손실도 줄였다.** MA 기반의 평균 손실(−6.5%)이
           고정 손절(−7.3%)보다 얕습니다. 주가가 MA 위에 머무는 동안
           손절선이 함께 올라오기 때문입니다.
        4. 종합하면, 이 매수 로직처럼 **추세를 노리는 시스템에는 MA 기반
           매도가 더 잘 맞습니다.** 다만 그 우위는 강세장에 집중되어 있으므로,
           횡보장 비중이 큰 구간에서는 고정 R이 앞설 수 있다는 점도 함께
           기억할 필요가 있습니다.

        ### 한계

        - 슬리피지·호가 공백은 수수료 외에 별도로 모델링하지 않았습니다
          (갭 상승/하락 시 시가 체결은 반영).
        - 단일 구간(2017~2026), 단일 파라미터(R=7%, MA20, 이격도 150/트레일링
          기준 MA20)의 결과이며, 파라미터 민감도는 추후 그리드 서치로 다룰
          예정입니다.
